# Builds the Android app on every push and publishes it as a GitHub release
# when the version (APP_VERSION in js/app.js) is new. The installed app finds the
# release through version.json and offers the update.
name: Android APK

on:
  push:
    branches: [main, apk-dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        env:
          MC_KEYSTORE: ${{ secrets.MEMOCHAT_KEYSTORE }}
          MC_KEYSTORE_PASSWORD: ${{ secrets.MEMOCHAT_KEYSTORE_PASSWORD }}
        run: bash android/build.sh

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: memochat-apk
          path: |
            android/build/memochat.apk
            android/build/version.json
          retention-days: 14

      - name: Publish release (only for a new version, signed with the release key)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat android/build/version)"
          if [ "$(cat android/build/release)" != "yes" ]; then
            echo "Not signed with the release key - not publishing."; exit 0
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists - bump APP_VERSION in js/app.js to publish a new one."; exit 0
          fi
          gh release create "v$V" android/build/memochat.apk android/build/version.json \
            --title "MemoChat $V" --notes "MemoChat $V for Android. Install memochat.apk over the previous version; your notes stay." --latest
